<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adaptive Unified Real-time Analyzer — Real‑Time Dashboard</title>
  <style>
    :root{
      --bg:#0b0f14; --fg:#e6edf3; --muted:#9fb0c3; --card:#121822; --bord:#1c2633;
      --ok:#17c964; --warn:#f5a524; --bad:#f31260; --info:#0070f3;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';}
    header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg, rgba(11,15,20,.95), rgba(11,15,20,.6));backdrop-filter:blur(8px);border-bottom:1px solid var(--bord);}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    h1{font-size:20px;margin:0 0 4px 0}
    .sub{color:var(--muted);font-size:13px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    button, input, select{background:#0e141d;color:var(--fg);border:1px solid var(--bord);border-radius:8px;padding:8px 10px;font-size:14px}
    button{cursor:pointer}
    button.primary{background:#0e1f36;border-color:#173657}
    button:disabled{opacity:.6;cursor:not-allowed}
    .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
    .status-ok{background:var(--ok)} .status-bad{background:var(--bad)} .status-warn{background:var(--warn)}
    main .grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
    .card{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:14px}
    .list{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto;padding-right:4px}
    .event{border:1px solid var(--bord);border-radius:12px;padding:10px}
    .title{display:flex;justify-content:space-between;gap:8px;align-items:center}
    .tiny{font-size:12px;color:var(--muted)}
    .badgeb{display:inline-flex;gap:6px;flex-wrap:wrap}
    .badge{border:1px solid var(--bord);border-radius:999px;padding:4px 8px;font-size:12px}
    .sev-low{border-color:#22402e;color:#7ee2a8}
    .sev-med{border-color:#4d3a10;color:#ffd18b}
    .sev-high{border-color:#4a1422;color:#ff99bb}
    .pill{background:#0e141d;border:1px solid var(--bord);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:6px;margin-top:6px}
    .section-title{font-weight:600;margin:0 0 8px 0}
    .incidents .card{padding:10px}
    .muted{color:var(--muted)}
    .danger{color:var(--bad)}
    .ok{color:var(--ok)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #dc2626, #b91c1c); border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">
          <div style="position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; background: linear-gradient(45deg, #ef4444, #dc2626, #b91c1c, #991b1b); border-radius: 8px; opacity: 0.8; animation: pulse-red 2s infinite;"></div>
          <svg style="width: 24px; height: 24px; color: white; z-index: 1;" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L13.09 8.26L20 9L13.09 9.74L12 16L10.91 9.74L4 9L10.91 8.26L12 2Z"/>
            <path d="M12 2L2 7L12 12L22 7L12 2Z" opacity="0.3"/>
            <path d="M12 12L2 17L12 22L22 17L12 12Z" opacity="0.2"/>
          </svg>
        </div>
        <h1>Adaptive Unified Real-time Analyzer</h1>
      </div>
      <div class="sub">
        <span id="conn"><span class="status-dot status-bad"></span>Disconnected</span> •
        Stream live process, network & file events. Detect via anomaly + YARA. Map to MITRE.
      </div>
      <div class="toolbar">
        <button id="btnConnect" class="primary">Disconnect</button>
        <button id="btnPause">Pause</button>
        <button id="btnIncidents">Load Incidents</button>
        <button id="btnYara">Reload YARA</button>
        <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
          <button id="btnScanPage" class="primary" title="Scan a file for threats">🗂️ Scan File</button>
          <button id="btnTestMalicious" class="primary" title="Test URL Safety">🔍 Test Malicious Site</button>
        </div>
        <label class="pill"><input id="chkSusp" type="checkbox" /> Show only suspicious</label>
        <input id="txtSearch" placeholder="Search name / path / cmdline…" style="flex:1" />
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="grid">
      <section class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <div class="section-title">Live Monitoring</div>
          <div class="tiny"><span id="totalCount">0</span> total events</div>
        </div>
        
        <!-- Event Type Tabs -->
        <div class="row" style="margin-bottom:12px;gap:4px">
          <button id="tabProcess" class="pill" style="background:var(--card);border:1px solid var(--bord);cursor:pointer">Process <span id="procCount">0</span></button>
          <button id="tabNetwork" class="pill" style="background:var(--card);border:1px solid var(--bord);cursor:pointer">Network <span id="netCount">0</span></button>
          <button id="tabFile" class="pill" style="background:var(--card);border:1px solid var(--bord);cursor:pointer">Files <span id="fileCount">0</span></button>
        </div>
        
        <!-- Event Lists -->
        <div id="processEvents" class="list" style="display:block"></div>
        <div id="networkEvents" class="list" style="display:none"></div>
        <div id="fileEvents" class="list" style="display:none"></div>
      </section>

      <aside class="card incidents">
        <div class="section-title">Incidents</div>
        <div class="tiny muted" style="margin-bottom:8px">Stored suspicious events (anomaly or YARA hits)</div>
        <div id="incidents" class="list"></div>
        <div class="tiny muted" id="incCount"></div>
      </aside>
    </div>
  </main>

  <script>
    let evtSource = null;
    let paused = false;
    let connected = false;
    const processEventsDiv = document.getElementById('processEvents');
    const networkEventsDiv = document.getElementById('networkEvents');
    const fileEventsDiv = document.getElementById('fileEvents');
    const incDiv = document.getElementById('incidents');
    const conn = document.getElementById('conn');
    const totalCountEl = document.getElementById('totalCount');
    const procCountEl = document.getElementById('procCount');
    const netCountEl = document.getElementById('netCount');
    const fileCountEl = document.getElementById('fileCount');
    const searchEl = document.getElementById('txtSearch');
    const suspEl = document.getElementById('chkSusp');
    const btnConnect = document.getElementById('btnConnect');
    const btnPause = document.getElementById('btnPause');
    const btnTestMalicious = document.getElementById('btnTestMalicious');
    const btnScanPage = document.getElementById('btnScanPage');
    
    // Tab elements
    const tabProcess = document.getElementById('tabProcess');
    const tabNetwork = document.getElementById('tabNetwork');
    const tabFile = document.getElementById('tabFile');
    
    // Event counters
    let processCount = 0;
    let networkCount = 0;
    let fileCount = 0;

    function setConn(ok){
      connected = ok;
      conn.innerHTML = (ok
        ? '<span class="status-dot status-ok"></span>Connected'
        : '<span class="status-dot status-bad"></span>Disconnected');
      btnConnect.textContent = ok ? 'Disconnect' : 'Connect';
      btnConnect.className = ok ? 'primary' : 'primary';
    }

    function severityOf(obj){
      if(obj.yara && obj.yara.length) return 'high';
      if(obj.detection && obj.detection.label === -1) return 'med';
      if(obj.mitre && obj.mitre.length) return 'med';
      // Check for suspicious network connections
      if(obj.event && obj.event.is_suspicious) return 'high';
      return 'low';
    }

    function matchFilters(obj){
      const q = (searchEl.value || '').toLowerCase();
      const ev = obj.event || {};
      
      // Build search text based on event type
      let txt = '';
      if (ev.type === 'process_sample') {
        txt = [ev.name, ev.cmdline, ev.exe, ev.path].filter(Boolean).join(' ').toLowerCase();
      } else if (ev.type === 'net_conn') {
        txt = [
          ev.remote_hostname,
          ev.laddr ? `${ev.laddr.ip}:${ev.laddr.port}` : '',
          ev.raddr ? `${ev.raddr.ip}:${ev.raddr.port}` : '',
          ev.status,
          ev.suspicious_reason
        ].filter(Boolean).join(' ').toLowerCase();
      } else if (ev.type === 'file_event') {
        txt = [ev.path, ev.subtype].filter(Boolean).join(' ').toLowerCase();
      }
      
      if (q && !txt.includes(q)) return false;
      if (suspEl.checked){
        const sev = severityOf(obj);
        if (sev === 'low') return false;
      }
      return true;
    }

    function renderCounts(){
      totalCountEl.textContent = processCount + networkCount + fileCount;
      procCountEl.textContent = processCount;
      netCountEl.textContent = networkCount;
      fileCountEl.textContent = fileCount;
    }

    function badge(text, cls){ return `<span class="badge ${cls||''}">${text}</span>`; }

    function renderEvent(obj){
      if (!matchFilters(obj)) return;
      const ev = obj.event || {};
      const sev = severityOf(obj);
      const sevCls = (sev==='high'?'sev-high':sev==='med'?'sev-med':'sev-low');
      const el = document.createElement('div');
      el.className = 'event';
      
      // Determine target container and update counter
      let targetDiv, eventType;
      if (ev.type === 'process_sample') {
        targetDiv = processEventsDiv;
        eventType = 'process';
        processCount++;
      } else if (ev.type === 'net_conn') {
        targetDiv = networkEventsDiv;
        eventType = 'network';
        networkCount++;
      } else if (ev.type === 'file_event') {
        targetDiv = fileEventsDiv;
        eventType = 'file';
        fileCount++;
      } else {
        return; // Unknown event type
      }
      
      // Render based on event type
      if (eventType === 'process') {
        el.innerHTML = `
          <div class="title">
            <div>
              ${badge(sev.toUpperCase(), sevCls)}
              <strong>${ev.name || 'Process'}</strong>
              <span class="pill">pid ${ev.pid}</span>
            </div>
            <div class="tiny">${new Date((ev.timestamp||Date.now())*1000).toLocaleTimeString()}</div>
          </div>
          <div class="kv tiny">
            <div>CPU</div><div>${ev.cpu_percent ?? '-'}%</div>
            <div>MEM</div><div>${ev.mem_percent ?? '-'}%</div>
            <div>EXE</div><div class="mono">${ev.exe || '-'}</div>
            <div>CMD</div><div class="mono">${ev.cmdline || '-'}</div>
          </div>
          <div class="badgeb" style="margin-top:6px">
            ${obj.yara ? badge('YARA: '+obj.yara.join(', '),'sev-high') : ''}
            ${obj.detection ? badge('score '+Number(obj.detection.score||0).toFixed(3),'sev-med') : ''}
          </div>
          <div class="row" style="margin-top:8px">
            <button data-action="kill">Kill process</button>
            ${ev.exe ? '<button data-action="quar">Quarantine file</button>' : ''}
          </div>
        `;
      } else if (eventType === 'network') {
        el.innerHTML = `
          <div class="title">
            <div>
              ${badge(sev.toUpperCase(), sevCls)}
              <strong>${ev.is_browsing ? '🌐 Browsing Activity' : 'Network Connection'}</strong>
              <span class="pill">pid ${ev.pid}</span>
              ${ev.is_browsing ? '<span class="pill" style="background:var(--info);color:white">Browsing</span>' : ''}
              ${ev.is_suspicious ? '<span class="badge sev-high">SUSPICIOUS</span>' : ''}
            </div>
            <div class="tiny">${new Date((ev.timestamp||Date.now())*1000).toLocaleTimeString()}</div>
          </div>
          <div class="kv tiny">
            <div>Status</div><div>${ev.status || '-'}</div>
            <div>Local</div><div class="mono">${ev.laddr ? (ev.laddr.ip+':'+ev.laddr.port) : '-'}</div>
            <div>Remote</div><div class="mono">${ev.raddr ? (ev.raddr.ip+':'+ev.raddr.port) : '-'}</div>
            ${ev.remote_hostname ? `<div>Domain</div><div class="mono">${ev.remote_hostname}</div>` : ''}
            <div>FD</div><div>${ev.fd || '-'}</div>
          </div>
          <div class="badgeb" style="margin-top:6px">
            ${obj.yara ? badge('YARA: '+obj.yara.join(', '),'sev-high') : ''}
            ${ev.suspicious_reason ? badge(ev.suspicious_reason, 'sev-high') : ''}
            ${ev.is_browsing ? badge('Web Traffic', 'sev-low') : ''}
          </div>
        `;
      } else if (eventType === 'file') {
        el.innerHTML = `
          <div class="title">
            <div>
              ${badge(sev.toUpperCase(), sevCls)}
              <strong>File ${ev.subtype || 'Event'}</strong>
            </div>
            <div class="tiny">${new Date((ev.timestamp||Date.now())*1000).toLocaleTimeString()}</div>
          </div>
          <div class="kv tiny">
            <div>Path</div><div class="mono">${ev.path || '-'}</div>
            <div>Type</div><div>${ev.subtype || '-'}</div>
          </div>
          <div class="badgeb" style="margin-top:6px">
            ${obj.yara ? badge('YARA: '+obj.yara.join(', '),'sev-high') : ''}
          </div>
          <div class="row" style="margin-top:8px">
            <button data-action="quar">Quarantine file</button>
          </div>
        `;
      }
      
      // Add action handlers
      el.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (btn.dataset.action === 'kill'){
            if(!confirm('Kill process '+ev.pid+' ?')) return;
            await mitigate('kill_process', {pid: ev.pid});
          } else if (btn.dataset.action === 'quar'){
            const path = ev.exe || ev.path;
            if(!path) return;
            if(!confirm('Quarantine file '+path+' ?')) return;
            await mitigate('quarantine_file', {path});
          }
        });
      });
      
      // Add to appropriate container
      targetDiv.prepend(el);
      
      // Trim lists
      [processEventsDiv, networkEventsDiv, fileEventsDiv].forEach(div => {
        while(div.childElementCount > 200){
          div.removeChild(div.lastChild);
        }
      });
      
      renderCounts();
    }

    async function mitigate(action, payload){
      try{
        const res = await fetch('/api/mitigate', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(Object.assign({action}, payload))
        });
        const j = await res.json();
        alert(JSON.stringify(j, null, 2));
      }catch(e){ alert('Mitigation failed: '+e); }
    }

    function connect(){
      if (evtSource) evtSource.close();
      evtSource = new EventSource('/api/stream');
      setConn(false);
      evtSource.onopen = () => setConn(true);
      evtSource.onerror = () => setConn(false);
      evtSource.onmessage = (e) => {
        if (paused) return;
        try {
          const obj = JSON.parse(e.data);
          renderEvent(obj);
        } catch(err){ }
      };
    }

    function disconnect(){
      if (evtSource) {
        evtSource.close();
        evtSource = null;
      }
      setConn(false);
      // Clear events when disconnected
      processEventsDiv.innerHTML = '';
      networkEventsDiv.innerHTML = '';
      fileEventsDiv.innerHTML = '';
      processCount = 0;
      networkCount = 0;
      fileCount = 0;
      renderCounts();
    }

    btnConnect.addEventListener('click', () => {
      if (connected) {
        disconnect();
      } else {
        connect();
      }
    });
    btnPause.addEventListener('click', () => {
      paused = !paused;
      btnPause.textContent = paused ? 'Resume' : 'Pause';
    });

    btnTestMalicious.addEventListener('click', () => {
      window.location.href = '/test-malicious';
    });

    btnScanPage.addEventListener('click', () => {
      window.location.href = '/scan-file';
    });

    document.getElementById('btnIncidents').addEventListener('click', async () => {
      const res = await fetch('/api/incidents');
      const arr = await res.json();
      document.getElementById('incCount').textContent = `${arr.length} stored`;
      incDiv.innerHTML = '';
      arr.forEach(inc => {
        const ev = inc.event || {};
        const it = document.createElement('div');
        it.className = 'card';
        it.innerHTML = `
          <div class="row" style="justify-content:space-between">
            <div><strong>Incident</strong> <span class="tiny muted">(${new Date(inc.ts*1000).toLocaleString()})</span></div>
            ${inc.yara ? '<span class="badge sev-high">YARA</span>' : ''}
          </div>
          <div class="tiny mono" style="margin-top:6px">${ev.name || ev.type || ''} — pid ${ev.pid||'-'} ${ev.path?('— '+ev.path):''}</div>
          <div class="badgeb" style="margin-top:6px">${(inc.mitre||[]).map(m => badge(m.technique_id)).join(' ')}</div>
        `;
        incDiv.prepend(it);
      });
    });

    document.getElementById('btnYara').addEventListener('click', async () => {
      try {
        // Show loading state
        const btn = document.getElementById('btnYara');
        const originalText = btn.textContent;
        btn.textContent = 'Reloading...';
        btn.disabled = true;
        
        // Reload YARA
        const res = await fetch('/api/yara/reload', {method:'POST'});
        const reloadResult = await res.json();
        
        // Get detailed status
        const statusRes = await fetch('/api/yara/status');
        const status = await statusRes.json();
        
        // Show comprehensive results
        let message = `YARA Engine: ${status.engine}\n`;
        if (status.engine === 'yara') {
          message += '✅ Full YARA engine active\n';
          message += `📁 Rules loaded successfully\n`;
        } else if (status.engine === 'fallback') {
          message += '⚠️ YARA engine not available\n';
          message += `🔍 Using fallback string matching\n`;
          message += `📝 ${status.fallback_strings} patterns extracted from rule files\n`;
        } else {
          message += '❌ No YARA engine or rules found\n';
          message += '💡 Install yara-python and add rules to yara_rules/ folder\n';
        }
        
        if (reloadResult.status === 'ok') {
          message += '\n✅ Reload completed successfully';
        } else {
          message += `\n⚠️ Reload result: ${reloadResult.status}`;
        }
        
        alert(message);
      } catch (e) {
        alert('YARA reload failed: ' + e.message);
      } finally {
        // Restore button
        const btn = document.getElementById('btnYara');
        btn.textContent = 'Reload YARA';
        btn.disabled = false;
      }
    });

    // Tab switching
    tabProcess.addEventListener('click', () => {
      processEventsDiv.style.display = 'block';
      networkEventsDiv.style.display = 'none';
      fileEventsDiv.style.display = 'none';
      tabProcess.style.background = 'var(--info)';
      tabNetwork.style.background = 'var(--card)';
      tabFile.style.background = 'var(--card)';
    });
    
    tabNetwork.addEventListener('click', () => {
      processEventsDiv.style.display = 'none';
      networkEventsDiv.style.display = 'block';
      fileEventsDiv.style.display = 'none';
      tabProcess.style.background = 'var(--card)';
      tabNetwork.style.background = 'var(--info)';
      tabFile.style.background = 'var(--card)';
    });
    
    tabFile.addEventListener('click', () => {
      processEventsDiv.style.display = 'none';
      networkEventsDiv.style.display = 'none';
      fileEventsDiv.style.display = 'block';
      tabProcess.style.background = 'var(--card)';
      tabNetwork.style.background = 'var(--card)';
      tabFile.style.background = 'var(--info)';
    });
    
    // Initialize with Process tab active
    tabProcess.style.background = 'var(--info)';

    [searchEl, suspEl].forEach(el => el.addEventListener('input', () => {
      [processEventsDiv, networkEventsDiv, fileEventsDiv].forEach(div => {
        Array.from(div.children).forEach(card => card.remove());
      });
      processCount = 0;
      networkCount = 0;
      fileCount = 0;
      renderCounts();
    }));

    connect();
  </script>
</body>
</html>
